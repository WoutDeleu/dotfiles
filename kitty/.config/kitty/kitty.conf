shell /usr/bin/zsh
font_family   JetBrainsMono Nerd Font
font_size     10.0

confirm_os_window_close 0

# Deep blue background — wallpaper shines through with a blue cast
background        #0a1726
background_opacity 0.82
dynamic_background_opacity yes

# Subtle blue tint layered over whatever shows through
background_tint   0.9

tab_bar_style powerline
tab_powerline_style round

# Tab colors — orange accent on the deep-blue background
active_tab_foreground   #0a1726
active_tab_background   #ff7800
active_tab_font_style   bold
inactive_tab_foreground #8aa0bf
inactive_tab_background #16263d
inactive_tab_font_style normal
tab_bar_background      #0a1726
tab_bar_min_tabs        1
tab_title_template      "{index}: {title}"

# Jump straight to a tab by number (0 = tab 10)
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab 10
