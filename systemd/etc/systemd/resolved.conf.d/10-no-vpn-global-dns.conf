# Neutralize a VPN client's GLOBAL DNS override.
#
# The F5 SSL VPN (svpn) rewrites the *main* /etc/systemd/resolved.conf on connect,
# pinning corporate DNS (10.24.12.17 / 10.242.5.17) + search domains as the
# SYSTEM-GLOBAL resolver and restarting systemd-resolved. If it doesn't cleanly
# restore its backup (resolved.conf.fp-saved) on disconnect — e.g. shutdown or
# crash while connected — you boot with corporate DNS as the global server. With
# the VPN off those servers are unreachable, so every public lookup fails until
# you cycle the VPN.
#
# Drop-ins are parsed AFTER the main file, and an empty assignment resets a list,
# so these two lines always clear whatever the VPN wrote to the GLOBAL scope —
# even on the resolved restart the VPN itself triggers.
#
# Corporate split-DNS is unaffected: F5 also registers per-link DNS + search
# domains on tun0 via the resolved D-Bus API (SetLinkDNS), which is independent
# of this config file. So:
#   VPN off -> global DNS empty  -> public names resolve via Wi-Fi (DHCP) DNS
#   VPN on  -> *.vrt.be etc. via tun0 (corporate), everything else via Wi-Fi
#
# No extra service is needed; the stack (iwd + networkd + resolved) is complete.
[Resolve]
DNS=
Domains=
