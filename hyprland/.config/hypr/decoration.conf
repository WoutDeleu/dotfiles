decoration {
    rounding = 10

    # Dim inactive windows so the active one stands out
    dim_inactive = true
    dim_strength = 0.1

    # Inactive windows fade back a little
    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 2
        passes = 1
    }
}

env = HYPRCURSOR_THEME,Bibata-Modern-Amber
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Amber
env = XCURSOR_SIZE,24
general {
   border_size = 5
   col.active_border = 0xff5ea1ff 1deg
}

animations {
    enabled = yes
    # Syntax: animation = NAME, ONOFF, SPEED, CURVE [, STYLE]
    animation = windows, 1, 3, default
    animation = border, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, default
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
