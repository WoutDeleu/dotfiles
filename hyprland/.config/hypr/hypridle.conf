# hypridle — unified idle daemon config (AC + battery aware)
#
# hypridle timeouts are static, so AC vs battery is handled by *guarding* the
# shorter battery listeners: `grep -q 1 <ACAD>/online || <action>` runs the
# action only when the charger is offline. The longer AC listeners run unguarded
# as the guaranteed fallback, so unplugging mid-idle still blanks/locks/suspends.
#
#            blank    lock     suspend-then-hibernate
#   battery  3 min    5 min    15 min
#   AC       7 min    8 min    20 min
#
# Blank-before-lock ordering is intentional (screen powers down first).
#
# TODO: eDP-1 sometimes stays black after suspend/resume (dpmsStatus still
# reports true even though the panel shows nothing). Legacy `hyprctl dispatch
# dpms on/off` below appears to error under this fork's Lua dispatch API
# (`hl.dsp.dpms(...)`), but `hl.dsp.dpms("on"/"off")` was found to *toggle*
# rather than set an absolute state, and `hl.monitor({dpms=...})` has no
# `dpms` field, so no reliable fix was found yet. Investigate the correct
# per-monitor absolute-state dpms API/dispatcher before changing this again.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ── Blank screen ──────────────────────────────────────────────────────────
# battery: 3 min
listener {
    timeout = 180
    on-timeout = grep -q 1 /sys/class/power_supply/ACAD/online || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
# AC / fallback: 7 min
listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# ── Lock ──────────────────────────────────────────────────────────────────
# battery: 5 min
listener {
    timeout = 300
    on-timeout = grep -q 1 /sys/class/power_supply/ACAD/online || loginctl lock-session
}
# AC / fallback: 8 min
listener {
    timeout = 480
    on-timeout = loginctl lock-session
}

# ── Suspend-then-hibernate ────────────────────────────────────────────────
# battery: 15 min
listener {
    timeout = 900
    on-timeout = grep -q 1 /sys/class/power_supply/ACAD/online || systemctl suspend-then-hibernate
}
# AC / fallback: 20 min
listener {
    timeout = 1200
    on-timeout = systemctl suspend-then-hibernate
}
