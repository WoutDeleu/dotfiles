# hypridle — AC power profile
# Timeouts: 3min lock → 7min screen off → 20min suspend-then-hibernate

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

# 7 minutes → turn off screen
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 8 minutes → lock screen
listener {
    timeout = 480
    on-timeout = loginctl lock-session
}

# 20 minutes → suspend (systemd will hibernate after HibernateDelaySec=2h)
listener {
    timeout = 1200
    on-timeout = systemctl suspend-then-hibernate
}
