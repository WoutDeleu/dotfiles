$mainMod = ALT
$terminal = kitty
$fileManager = kitty -e yazi
$menu = ~/.config/rofi/launchers/type-2/launcher.sh
$powermenu = ~/.config/rofi/powermenu/type-2/powermenu.sh
$browser = helium-browser

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, killactive
# bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, ~/.config/hypr/scripts/toggle-yazi.sh
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, Escape, exec, $powermenu
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, P, pseudo
bind = $mainMod, T, layoutmsg, togglesplit

# Move focus (vim keys + arrows)
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r
# to switch between windows in a floating workspace
bind = alt, space, exec, $(hyprctl activewindow -j | jq '.floating') && hyprctl dispatch cyclenext tiled || hyprctl dispatch cyclenext floating


# Move window (vim keys + arrows)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Resize window (vim keys + arrows)
binde = $mainMod CTRL, H, resizeactive, -50 0
binde = $mainMod CTRL, J, resizeactive, 0 50
binde = $mainMod CTRL, K, resizeactive, 0 -50
binde = $mainMod CTRL, L, resizeactive, 50 0
binde = $mainMod CTRL, up,    resizeactive, 0 -50
binde = $mainMod CTRL, down,  resizeactive, 0 50

# Monitors (external DP-1 = left, laptop eDP-1 = right)
bind = $mainMod CTRL, left, focusmonitor, l
bind = $mainMod CTRL, right, focusmonitor, r
bind = $mainMod CTRL, H, focusmonitor, l
bind = $mainMod CTRL, L, focusmonitor, r
bind = $mainMod CTRL SHIFT, left, movewindow, mon:l
bind = $mainMod CTRL SHIFT, right, movewindow, mon:r
bind = $mainMod CTRL SHIFT, H, movewindow, mon:l
bind = $mainMod CTRL SHIFT, L, movewindow, mon:r
bind = $mainMod SUPER, left, movecurrentworkspacetomonitor, l
bind = $mainMod SUPER, right, movecurrentworkspacetomonitor, r
bind = $mainMod SUPER, H, movecurrentworkspacetomonitor, l
bind = $mainMod SUPER, L, movecurrentworkspacetomonitor, r

# Notification center (swaync)
bind = CTRL SHIFT, N, exec, swaync-client -t -sw   # toggle panel
bind = CTRL, N, exec, swaync-client -d -sw          # toggle do-not-disturb

# NuPhy: swap left Alt<->Win so the Opt key
# acts as the main modifier (SUPER), matching the laptop's Win key.
# Per-device kb_options override the global ones, so caps:escape is repeated here.
device {
   name = nuphy-halo65-v2-2-keyboard
   kb_options = caps:escape,altwin:swap_lalt_lwin
}
device {
   name = nuphy-air75-v2-1-keyboard
   kb_options = caps:escape,altwin:swap_lalt_lwin
}
# Mouse/trackpad
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Change scroll speed for Brave (factor < 1.0 = slower)
windowrule = scroll_touchpad 0.5, match:class helium

# ── Lid switch ────────────────────────────────────────────────────────────
# logind (lid.conf) handles suspend-then-hibernate when undocked.
# When docked (HandleLidSwitchDocked=ignore), Hyprland disables/re-enables eDP-1.
bindl = , switch:on:Lid Switch,  exec, hyprctl keyword monitor eDP-1,disable
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor eDP-1,1920x1080,auto,1,bitdepth,8

# ── Hotkeys ───────────────────────────────────────────────────────────────
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = , XF86Calculator, exec, $terminal
bind = , XF86SelectiveScreenshot, exec, grim -g "$(slurp)" - | wl-copy
bind = , XF86AudioPlay,  exec, swayosd-client --playerctl play-pause
bind = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bind = , XF86AudioNext,  exec, swayosd-client --playerctl next
bind = , XF86AudioPrev, exec, swayosd-client --playerctl previous

# Increase Volume
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
# Decrease Volume
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
# Mute/Unmute Audio
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Increase Brightness
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
# Decrease Brightness
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
