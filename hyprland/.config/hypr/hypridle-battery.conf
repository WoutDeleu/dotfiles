# hypridle — battery profile
# Timeouts: 3min lock → 5min screen off → 15min suspend-then-hibernate

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 3 minutes → lock screen
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

# 5 minutes → turn off screen
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 15 minutes → suspend (systemd will hibernate after HibernateDelaySec=2h)
listener {
    timeout = 900
    on-timeout = systemctl suspend-then-hibernate
}
