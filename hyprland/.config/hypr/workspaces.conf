# Bind workspaces to monitors (i3-style).
# DP-1 (external) = primary -> 1-5   |   eDP-1 (laptop) = reference -> 6-10
# On undock, Hyprland auto-migrates the external's workspaces to the laptop
# and restores them to DP-1 when it reconnects.
workspace = 1,  monitor:DP-1,  default:true   # terminal
workspace = 2,  monitor:DP-1                   # github
workspace = 3,  monitor:DP-1                   # dev
workspace = 4,  monitor:DP-1                   # debug
workspace = 5,  monitor:eDP-1                  # chat
workspace = 6,  monitor:eDP-1                  # mail
workspace = 7,  monitor:DP-1                   # agenda (on external/primary)
workspace = 8,  monitor:eDP-1, default:true    # music
workspace = 9,  monitor:eDP-1                  # video
workspace = 10, monitor:eDP-1                  # other

# Switch workspaces
bind = $mainMod, 1, workspace, 1    # terminal
bind = $mainMod, 2, workspace, 2    # github
bind = $mainMod, 3, workspace, 3    # dev
bind = $mainMod, 4, workspace, 4    # debug
bind = $mainMod, 5, workspace, 5    # chat
bind = $mainMod, 6, workspace, 6    # mail
bind = $mainMod, 7, workspace, 7    # agenda
bind = $mainMod, 8, workspace, 8    # music
bind = $mainMod, 9, workspace, 9    # video
bind = $mainMod, 0, workspace, 10   # other

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1    # terminal
bind = $mainMod SHIFT, 2, movetoworkspace, 2    # github
bind = $mainMod SHIFT, 3, movetoworkspace, 3    # dev
bind = $mainMod SHIFT, 4, movetoworkspace, 4    # debug
bind = $mainMod SHIFT, 5, movetoworkspace, 5    # chat
bind = $mainMod SHIFT, 6, movetoworkspace, 6    # mail
bind = $mainMod SHIFT, 7, movetoworkspace, 7    # agenda
bind = $mainMod SHIFT, 8, movetoworkspace, 8    # music
bind = $mainMod SHIFT, 9, movetoworkspace, 9    # video
bind = $mainMod SHIFT, 0, movetoworkspace, 10   # other

# Cycle workspaces with scroll (also works via MX Master 3 thumb button held as $mainMod)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, D, movetoworkspace, +0   # dump focused window to current workspace
