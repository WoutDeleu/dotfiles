# Screenshots (grim + slurp + satty)

# Region select -> annotate in satty -> copy to clipboard only
bind = , Print, exec, grim -g "$(slurp)" - | satty --filename - --early-exit --copy-command wl-copy

# Region select -> copy straight to clipboard (no editor)
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy
