source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/mouse.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/hotkeys.conf
source = ~/.config/hypr/notifications.conf
source = ~/.config/hypr/workspaces.conf
# HyprMod managed settings
source = ~/.config/hypr/hyprland-gui.conf


# System config
input {
   follow_mouse = 2
   kb_layout = us
   kb_options = caps:escape,escape:caps
   touchpad {
      natural_scroll = true
   }
}
cursor {
   no_warps = false
}

# Appearance
env = HYPRCURSOR_THEME,Bibata-Modern-Amber
env = HYPRCURSOR_SIZE,24
decoration {
   rounding = 10
}
general {
   border_size = 5
   col.active_border = 0xffff7800 1deg
}

animations {
    enabled = yes
    # Syntax: animation = NAME, ONOFF, SPEED, CURVE [, STYLE]
    animation = windows, 1, 3, default
    animation = border, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, default
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
