source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/mouse.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/hotkeys.conf
source = ~/.config/hypr/notifications.conf
# HyprMod managed settings
source = /home/woutd/.config/hypr/hyprland-gui.conf


# System config
input {
   follow_mouse = 2
   kb_layout = us
   kb_options = caps:escape,escape:caps
   touchpad {
      natural_scroll = true
   }
}
cursor {
   no_warps = false
}

# Appearance
decoration {
   rounding = 10
}
general {
   border_size = 5
   col.active_border = 0xffff7800 1deg
}
