// logiops (logid) configuration — deploy to /etc/logid.cfg
//
// Purpose: make the MX Master 3 thumb gesture button act as the Hyprland
// main modifier so that "thumb button + scroll wheel" cycles workspaces.
//
// logiops holds the key down while the button is held, so cid 0xc3 ->
// KEY_LEFTALT means thumb-button + scroll = ALT + scroll, which matches the
// Hyprland bind in hyprland/.config/hypr/workspaces.conf:
//     bind = $mainMod, mouse_down, workspace, e+1
//     bind = $mainMod, mouse_up,   workspace, e-1
// ($mainMod = ALT). If $mainMod changes, update the key below to match
// (e.g. KEY_LEFTMETA for SUPER).
//
// Deploy:   sudo cp logid.cfg /etc/logid.cfg
// Enable:   sudo systemctl enable --now logid
// Restart:  sudo systemctl restart logid   (after edits)
// Verify the device name with: sudo logid -v  (may differ from hyprctl devices)

devices: (
{
    name: "MX Master 3 for Mac";

    // keep sensible defaults
    smartshift: {
        on: true;
        threshold: 15;
    };

    hiresscroll: {
        hires: true;
        invert: false;
        target: false;
    };

    dpi: 1000;

    buttons: (
        {
            cid: 0xc3;   // thumb gesture button
            action = {
                type: "Keypress";
                keys: ["KEY_LEFTALT"];
            };
        }
    );
}
);
