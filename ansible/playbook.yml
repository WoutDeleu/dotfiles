---
- name: Configure Arch Linux workstation
  hosts: local
  become: true

  vars_files: []
    # - vars/secrets.yml  # ansible-vault encrypted secrets (SSH keys, tokens, etc.)

  tasks:

    # ── Base packages ────────────────────────────────────────────────────────
    - name: Install base packages
      community.general.pacman:
        name:
          - git
          - stow
          - base-devel
        state: present
        update_cache: true

    # ── Desktop (Wayland / Hyprland) ─────────────────────────────────────────
    # Add Hyprland, Waybar, wofi, hyprpaper, swaylock, etc. here

    # ── Terminal & shell ─────────────────────────────────────────────────────
    # Add terminal emulator, zsh, starship, etc. here

    # ── Development tools ────────────────────────────────────────────────────
    # Add neovim, git tools, language toolchains, etc. here

    # ── Applications ─────────────────────────────────────────────────────────
    # Add Brave, Bitwarden, file manager, etc. here

    # ── System services ──────────────────────────────────────────────────────
    # Add systemd service enables here

    # ── Dotfiles ─────────────────────────────────────────────────────────────
    - name: Stow dotfiles
      become: false
      command:
        cmd: stow {{ item }}
        chdir: "{{ ansible_env.HOME }}/linux-setup/dotfiles"
      loop: []
        # - hyprland
        # - waybar
        # - terminal
        # - nvim
        # - git
      when: false  # remove this line once packages are populated
