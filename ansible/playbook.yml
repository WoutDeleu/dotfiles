---
- name: Configure Arch Linux workstation
  hosts: local
  become: true

  vars_files: []
    # - vars/secrets.yml  # ansible-vault encrypted secrets (SSH keys, tokens, etc.)

  tasks:

    # ── Base packages ────────────────────────────────────────────────────────
    - name: Install base packages
      community.general.pacman:
        name:
          - git
          - stow
          - base-devel
        state: present
        update_cache: true

    # ── Desktop (Wayland / Hyprland) ─────────────────────────────────────────
    # Add Hyprland, Waybar, wofi, hyprpaper, swaylock, etc. here

    # ── Terminal & shell ─────────────────────────────────────────────────────
    # Add terminal emulator, zsh, starship, etc. here

    # ── Development tools ────────────────────────────────────────────────────
    # Add neovim, git tools, language toolchains, etc. here

    # ── Applications ─────────────────────────────────────────────────────────
    # Add Brave, Bitwarden, file manager, etc. here

    # ── System services ──────────────────────────────────────────────────────
    - name: Deploy logid config
      copy:
        src: files/logid.cfg
        dest: /etc/logid.cfg
        owner: root
        group: root
        mode: '0644'

    - name: Enable system services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - logid
        - sddm

    # ── User services ─────────────────────────────────────────────────────────
    - name: Enable user services
      become: false
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        scope: user
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      loop:
        - hyprpolkitagent
        - cliphist

    # ── Dotfiles ─────────────────────────────────────────────────────────────
    - name: Stow dotfiles
      become: false
      command:
        cmd: stow {{ item }}
        chdir: "{{ ansible_env.HOME }}/linux-setup/dotfiles"
      loop: []
        # - hyprland
        # - waybar
        # - terminal
        # - nvim
        # - git
        # - systemd
      when: false  # remove this line once packages are populated
